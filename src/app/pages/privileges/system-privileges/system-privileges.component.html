<div class="row" style="width: 75vw; height: 100vh">
  <div class="col-md-5 w-100 h-100">
    <table mat-table [dataSource]="sourceTableData" class="mat-elevation-z8">
      <!-- Checkbox Column -->
      <ng-container matColumnDef="sourceSelect">
        <th mat-header-cell *matHeaderCellDef>
          <mat-checkbox
            (change)="$event ? toggleAllSourceRows() : null"
            [checked]="sourceSelection.hasValue() && isAllSourceSelected()"
            [indeterminate]="
              sourceSelection.hasValue() && !isAllSourceSelected()
            "
            [aria-label]="sourceCheckboxLabel()"
          >
          </mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row">
          <mat-checkbox
            (click)="$event.stopPropagation(); onSourceTableDataSelect(row)"
            (change)="$event ? sourceSelection.toggle(row) : null"
            [checked]="sourceSelection.isSelected(row)"
            [aria-label]="sourceCheckboxLabel(row)"
          >
          </mat-checkbox>
        </td>
      </ng-container>

      <!-- Position Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>Id</th>
        <td mat-cell *matCellDef="let element">{{ element.id }}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let element">{{ element.description }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="sourceDisplayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: sourceDisplayedColumns"
        (click)="sourceSelection.toggle(row)"
      ></tr>
    </table>
  </div>
  <div class="col-md-1 w-100 h-100">
    <div class="row m-1">
      <button
        type="button"
        class="btn btn-primary"
        (click)="moveFromSourceToTarget()"
      >
        >
      </button>
    </div>
    <!-- <div class="row m-1">
      <button
        type="button"
        class="btn btn-danger"
        (click)="moveAllFromSourceToTarget()"
      >
        >>
      </button>
    </div> -->
    <!-- <div class="row m-1">
      <button
        type="button"
        class="btn btn-danger"
        (click)="moveAllFromTargetToSource()"
      >
        <<
      </button>
    </div> -->
    <div class="row m-1">
      <button
        type="button"
        class="btn btn-primary"
        (click)="moveFromTargetToSource()"
      >
        <
      </button>
    </div>
    <div class="row mb-1">
      <button type="button" class="btn btn-primary" (click)="saveData()">
        Save
      </button>
    </div>
    <div class="row mb-1">
      <button
        type="button"
        class="btn btn-primary"
        (click)="moveFromTargetToSource()"
      >
        Reset
      </button>
    </div>
    <div class="row">
      <button
        type="button"
        class="btn btn-primary"
        (click)="moveFromTargetToSource()"
      >
        Cancel
      </button>
    </div>
  </div>
  <div class="col-md-6 w-100 h-100">
    <table mat-table [dataSource]="targetTableData" class="mat-elevation-z8">
      <!-- Checkbox Column -->
      <ng-container matColumnDef="targetSelect">
        <th mat-header-cell *matHeaderCellDef>
          <mat-checkbox
            (change)="$event ? toggleAllTargetRows() : null"
            [checked]="targetSelection.hasValue() && isAllTargetSelected()"
            [indeterminate]="
              targetSelection.hasValue() && !isAllTargetSelected()
            "
            [aria-label]="targetCheckboxLabel()"
          >
          </mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row">
          <mat-checkbox
            (click)="$event.stopPropagation(); onTargetTableDataSelect(row)"
            (change)="$event ? targetSelection.toggle(row) : null"
            [checked]="targetSelection.isSelected(row)"
            [aria-label]="targetCheckboxLabel(row)"
          >
          </mat-checkbox>
        </td>
      </ng-container>

      <!-- Position Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>Id</th>
        <td mat-cell *matCellDef="let element">{{ element.id }}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let element">{{ element.description }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="targetDisplayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: targetDisplayedColumns"
        (click)="targetSelection.toggle(row)"
      ></tr>
    </table>
  </div>
</div>
